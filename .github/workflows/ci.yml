name: CI — Tests et Qualité du Code

# Se déclenche à chaque push et pull request sur main et dev
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  qualite-code:
    name: Vérification qualité du code
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du repo
      - name: Récupération du code
        uses: actions/checkout@v4

      # 2. Installer Python 3.11
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Installer les dépendances du projet (nécessaire pour que pylint puisse
      # résoudre les imports de pandas/scikit-learn/etc. dans src/)
      - name: Installation des dépendances
        run: pip install -r requirements.txt

      # 4. Régénérer le modèle entraîné à partir du CSV nettoyé (versionné) —
      # models/*.pkl est gitignoré (trop volumineux), donc absent après un clone.
      # models/scaler.pkl est l'exception déjà committée (voir .gitignore).
      - name: Entraînement du modèle
        run: python src/save_model.py

      # 5. Lancer toute la suite de tests (qualité de code + preprocessing +
      # modèle + API), plus seulement le linting.
      - name: Tests (preprocessing, modèle, API, qualité de code)
        run: pytest tests/ -v
